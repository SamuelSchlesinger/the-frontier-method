name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      - name: Audit theorem axioms
        run: lake env lean scripts/Audit.lean
      - name: Check the worked circuit example
        run: lake env lean -DwarningAsError=true examples/Compiler.lean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check reference counting procedures
        run: python scripts/check_algorithms.py
      - name: Check communication capacity experiments
        run: python scripts/check_communication.py
      - name: Check restriction and affine preparation experiments
        run: python research/communication/restrictions.py
      - name: Check additive syndrome generators
        run: python research/communication/syndrome_generator.py
      - name: Check unambiguous additive peeling
        run: python research/communication/unambiguous.py
      - name: Check mixed-fiber ranks and terminal pathwidth
        run: python research/communication/rank_profiles.py

  comparator:
    name: Comparator statements and proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise Comparator rejection cases
        run: python scripts/comparator.py self-test
      - name: Compare all public theorem statements and replay proofs
        run: python scripts/comparator.py check
      - name: Preserve Comparator reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-reports
          path: |
            .lake/comparator/*/report.json
            .lake/comparator/*/*.log
            .lake/comparator/*/*.stderr
            .lake/comparator/self-test-*/*/*.log
            .lake/comparator/self-test-*/*/*.stderr
          include-hidden-files: true
